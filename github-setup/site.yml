# This file must live at  .github/workflows/site.yml  in your GitHub repository.
# (See the README for how to create it there.)
#
# Every 30 minutes it fetches fresh match data and publishes the site to GitHub Pages.
# If the data fetch fails, nothing is published and the site keeps its last good version.

name: Update site

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect site files
        run: |
          mkdir _site
          cp index.html style.css app.js teams.js ratings.js sample-data.js _site/

      - name: Fetch latest match data
        run: node scripts/fetch-matches.js
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          OUT_FILE: _site/matches.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
